# SAM deployment configuration — generated by `sam deploy --guided`.
# Fill in stack_name and region, then run `sam deploy` (no --guided needed).
#
# Recommended first deploy:
#   1. Set parameter_overrides to "DecisionEngine=rules" to confirm the
#      pipeline works with zero Bedrock dependency.
#   2. Once confirmed, change to "DecisionEngine=bedrock" and redeploy.

version = 0.1

[default.global.parameters]
stack_name = "guardian-mcp"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region              = "us-east-1"
confirm_changeset   = true
capabilities        = "CAPABILITY_IAM"
disable_rollback    = false
parameter_overrides = "DecisionEngine=\"bedrock\" BedrockModelId=\"amazon.nova-lite-v1:0\""
# s3_bucket is set automatically by sam deploy --guided on first run.
# Uncomment and fill in after your first guided deploy:
# s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-XXXXXXXXXXXX"
# s3_prefix = "guardian-mcp"
resolve_s3 = true
s3_prefix = "guardian-mcp"
image_repositories = []
